name: Recover pending release

on:
  workflow_run:
    workflows: [CI, CodeQL]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '5,20,35,50 * * * *'

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: protected-main-mutation
  cancel-in-progress: false
  queue: max

jobs:
  metadata:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: read
      issues: read
      security-events: read
      attestations: read
    outputs:
      ready: ${{ steps.hold.outputs.active == 'true' && 'false' || (steps.publication.outputs.verified == 'true' && 'false' || steps.recovery.outputs.ready) }}
      source: ${{ steps.recovery.outputs.source }}
      main: ${{ steps.recovery.outputs.main }}
      version: ${{ steps.recovery.outputs.version }}
      tag: ${{ steps.recovery.outputs.tag }}
      built_at: ${{ steps.recovery.outputs.built_at }}
      original_run_id: ${{ steps.recovery.outputs.original_run_id }}
      tag_present: ${{ steps.recovery.outputs.tag_present }}
      tag_object_type: ${{ steps.recovery.outputs.tag_object_type }}
      tag_object_sha: ${{ steps.recovery.outputs.tag_object_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - id: hold
        name: Enforce release normalization hold
        run: node scripts/release-resume.mjs guard-rebuild
      - name: Test trusted recovery invariants
        run: node --test .github/scripts/release-recover.test.mjs .github/scripts/release-publication-guard.test.mjs .github/scripts/release-missing-tag-guard.test.mjs .github/scripts/release-create-consistency.test.mjs scripts/release-normalization-hold.test.mjs
      - name: Verify immutable recovery execution before any release mutation
        if: steps.hold.outputs.active != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_EXECUTION_SHA: ${{ github.sha }}
        run: node .github/scripts/release-publication-guard.mjs execution
      - id: missing_tag
        if: steps.hold.outputs.active != 'true'
        name: Withdraw tagless public release fail closed
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_EXECUTION_SHA: ${{ github.sha }}
        run: node .github/scripts/release-missing-tag-guard.mjs
      - id: publication
        if: steps.hold.outputs.active != 'true'
        name: Preserve only cryptographically verified public releases
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_EXECUTION_SHA: ${{ github.sha }}
          RECOVERY_PRECHECK_TAG_ABSENT: ${{ steps.missing_tag.outputs.tag_absent }}
        run: node .github/scripts/release-publication-guard.mjs preflight
      - id: recovery
        if: steps.hold.outputs.active != 'true' && steps.publication.outputs.verified != 'true'
        name: Verify historical release provenance and recovery source
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_EXECUTION_SHA: ${{ github.sha }}
          RECOVERY_PRECHECK_TAG_ABSENT: ${{ steps.missing_tag.outputs.tag_absent }}
        shell: bash
        run: |
          node .github/scripts/release-recover.mjs metadata
          if [ "$RECOVERY_PRECHECK_TAG_ABSENT" = "true" ] && grep -qx 'tag_present=true' "$GITHUB_OUTPUT"; then
            echo "A tag appeared after the explicit absent-tag precheck; refusing to re-baseline recovery trust." >&2
            exit 1
          fi

  verify:
    needs: metadata
    if: needs.metadata.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.source }}
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: go test ./...
      - run: go vet ./...
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm audit --audit-level=high
      - run: git diff --exit-code

  binaries:
    needs: [metadata, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            binary: darkphish
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            binary: darkphish
          - runner: windows-2025
            goos: windows
            goarch: amd64
            binary: darkphish.exe
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            binary: darkphish
          - runner: macos-15
            goos: darwin
            goarch: arm64
            binary: darkphish
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.source }}
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      - name: Enable the runner's MinGW compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compilerDirectory = @('C:\mingw64\bin', 'C:\msys64\mingw64\bin') |
            Where-Object { Test-Path -LiteralPath (Join-Path $_ 'gcc.exe') } |
            Select-Object -First 1
          if (-not $compilerDirectory) { throw "Required MinGW compiler is unavailable" }
          $compilerDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Rebuild and package immutable release source
        shell: pwsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_BINARY: ${{ matrix.binary }}
          BUILT_AT: ${{ needs.metadata.outputs.built_at }}
          COMMIT_SHA: ${{ needs.metadata.outputs.source }}
        run: |
          $name = "darkphish-$env:RELEASE_TAG-$env:GOOS-$env:GOARCH"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          $ldflags = "-s -w -X main.releaseVersion=$env:RELEASE_VERSION -X main.commitSHA=$env:COMMIT_SHA -X main.builtAt=$env:BUILT_AT"
          go build -trimpath -ldflags $ldflags -o "dist/$name/$env:RELEASE_BINARY" ./
          if ($LASTEXITCODE -ne 0) { throw "Native recovery build failed" }
          $versionOutput = & "dist/$name/$env:RELEASE_BINARY" version
          $versionParts = $env:RELEASE_VERSION -split '\.'
          $displayVersion = $versionParts[0..1] -join '.'
          if ($versionOutput -notmatch "Darkphish $displayVersion" -or $versionOutput -match '-dev' -or $versionOutput -notmatch [regex]::Escape($env:COMMIT_SHA)) {
            throw "Recovered binary did not report release metadata: $versionOutput"
          }
          Copy-Item VERSION,LICENSE,NOTICE.md,README.md,CHANGELOG.md,config.json -Destination "dist/$name"
          # Historical sources predate licensing; never inject a current trust key into them.
          if (Test-Path -LiteralPath license-public-keys.json) {
            Copy-Item license-public-keys.json -Destination "dist/$name"
          }
          Copy-Item db,templates -Recurse -Destination "dist/$name"
          New-Item -ItemType Directory -Force -Path "dist/$name/static/js","dist/$name/static/css" | Out-Null
          Copy-Item static/images,static/font,static/db,static/endpoint -Recurse -Destination "dist/$name/static"
          Copy-Item static/js/dist,static/js/src -Recurse -Destination "dist/$name/static/js"
          Copy-Item static/css/dist -Recurse -Destination "dist/$name/static/css"
          if ($env:GOOS -eq 'windows') {
            Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          } else {
            tar -czf "dist/$name.tar.gz" -C dist $name
          }
      - uses: actions/upload-artifact@v7
        with:
          name: recovery-${{ needs.metadata.outputs.tag }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  audit-smoke:
    needs: [metadata, binaries]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: darkphish_binary_audit_test
          POSTGRES_USER: darkphish
          POSTGRES_PASSWORD: darkphish-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darkphish -d darkphish_binary_audit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.source }}
      - uses: actions/download-artifact@v8
        with:
          name: recovery-${{ needs.metadata.outputs.tag }}-linux-amd64
          path: .cache/native-audit
      - name: Extract the exact recovery archive
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: tar -xzf ".cache/native-audit/darkphish-$RELEASE_TAG-linux-amd64.tar.gz" -C .cache/native-audit
      - uses: ./.github/actions/audit-binary-smoke
        with:
          binary: .cache/native-audit/darkphish-${{ needs.metadata.outputs.tag }}-linux-amd64/darkphish
          sha: ${{ needs.metadata.outputs.source }}

  publish:
    needs: [metadata, binaries, audit-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: read
      issues: read
      security-events: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.source }}
          path: .cache/source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v8
        with:
          pattern: recovery-${{ needs.metadata.outputs.tag }}-*
          path: dist
          merge-multiple: true
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2, Node24
        with:
          path: .cache/source
          format: spdx-json
          output-file: dist/darkphish-${{ needs.metadata.outputs.tag }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Generate recovery checksums
        working-directory: dist
        run: sha256sum -- *.zip *.tar.gz *.spdx.json > SHA256SUMS
      - name: Generate recovery publication receipt
        env:
          RECOVERY_VERSION: ${{ needs.metadata.outputs.version }}
          RECOVERY_SOURCE: ${{ needs.metadata.outputs.source }}
        run: node .github/scripts/release-publication-guard.mjs receipt
      - name: Attest rebuilt recovery artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*
            .cache/recovery-receipt/*
      - name: Publish rebuilt verified recovery assets
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_VERSION: ${{ needs.metadata.outputs.version }}
          RECOVERY_SOURCE: ${{ needs.metadata.outputs.source }}
          RECOVERY_MAIN: ${{ needs.metadata.outputs.main }}
          RECOVERY_ORIGINAL_RUN_ID: ${{ needs.metadata.outputs.original_run_id }}
          RECOVERY_TAG_PRESENT: ${{ needs.metadata.outputs.tag_present }}
          RECOVERY_TAG_OBJECT_TYPE: ${{ needs.metadata.outputs.tag_object_type }}
          RECOVERY_TAG_OBJECT_SHA: ${{ needs.metadata.outputs.tag_object_sha }}
          RECOVERY_SOURCE_DIR: .cache/source
        run: node --import ./.github/scripts/release-create-consistency.mjs .github/scripts/release-recover.mjs publish
      - name: Verify published recovery including receipt attestation
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_VERSION: ${{ needs.metadata.outputs.version }}
          RECOVERY_SOURCE: ${{ needs.metadata.outputs.source }}
          RECOVERY_EXECUTION_SHA: ${{ github.sha }}
          RECOVERY_TAG_PRESENT: ${{ needs.metadata.outputs.tag_present }}
          RECOVERY_TAG_OBJECT_TYPE: ${{ needs.metadata.outputs.tag_object_type }}
          RECOVERY_TAG_OBJECT_SHA: ${{ needs.metadata.outputs.tag_object_sha }}
        run: node .github/scripts/release-postpublish-verify.mjs
