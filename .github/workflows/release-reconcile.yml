name: Reconcile release metadata

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type reconcile-public-metadata to run historical maintenance'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: protected-main-mutation
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.confirmation == 'reconcile-public-metadata'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: read
    outputs:
      sha: ${{ steps.execution.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - name: Verify release-note formatting and provenance tests
        run: node --test scripts/release-notes.test.mjs scripts/release-body-match.test.mjs scripts/release-staged-provenance.test.mjs scripts/release-draft-tag-repair.test.mjs scripts/release-normalization-hold.test.mjs
      - name: Verify exact green protected main
        id: execution
        env:
          GH_TOKEN: ${{ github.token }}
          RECONCILE_EXECUTION_SHA: ${{ github.sha }}
        run: node scripts/release-reconcile.mjs verify-execution

  reconcile:
    needs: verify
    if: needs.verify.result == 'success' && needs.verify.outputs.sha != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: read
      issues: read
      security-events: read
      attestations: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - name: Confirm immutable checkout
        env:
          EXPECTED_SHA: ${{ needs.verify.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Enforce trusted normalization hold
        if: hashFiles('.github/release-normalization-hold.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_EXECUTION_SHA: ${{ needs.verify.outputs.sha }}
        run: node .github/scripts/release-publication-guard.mjs hold
      - name: Reconcile trusted release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RECONCILE_EXECUTION_SHA: ${{ needs.verify.outputs.sha }}
        run: node scripts/release-reconcile.mjs reconcile
