{{ define "base" }}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DarkPhish — Human Risk Management Platform">
    <link rel="icon" type="image/svg+xml" href="/images/darkphish-mark.svg">

    <title>{{ .Title }} - DarkPhish</title>

    <link href="/css/dist/darkphish.css" rel="stylesheet" type="text/css">
    <script>
        {{if .User}}
    var user = {
        username : {{ .User.Username }}
    }
    {{end}}
    </script>
</head>

<body class="enterprise-ui">
    <div class="navbar navbar-inverse navbar-fixed-top darkphish-topbar" role="navigation" aria-label="Account navigation">
        <div class="container-fluid">
            <div class="navbar-header">
                <a class="navbar-brand darkphish-brand" href="/" aria-label="DarkPhish home"><img src="/images/darkphish-mark.svg" alt="" width="40" height="40"><span>Dark<span class="brand-light">Phish</span></span></a>
            </div>
            <div class="darkphish-account">
                <ul class="nav navbar-nav navbar-right">
                    {{if .ModifySystem}}
                    <li class="dropdown" id="adminNotifications">
                        <a href="#" class="dropdown-toggle" data-toggle="dropdown" aria-label="Admin notifications" aria-expanded="false"><i class="fa fa-bell" aria-hidden="true"></i> <span id="adminNotificationBadge" class="badge" hidden></span></a>
                        <ul class="dropdown-menu"><li><a id="adminReleaseNotification" href="/settings?tab=update">Check release information</a></li></ul>
                    </li>
                    {{end}}
                    <li>
                        {{if .User}}
                        <div class="btn-group" id="navbar-dropdown">
                            <a class="btn btn-primary darkphish-account-name" href="/settings" title="Account settings: {{.User.Username}}"><i class="fa fa-user" aria-hidden="true"></i> <span>{{.User.Username}}</span></a>
                            <a class="btn btn-primary" href="/logout" aria-label="Sign out" title="Sign out">
                                <i class="fa fa-sign-out" aria-hidden="true"></i>
                            </a>
                        </div>
                        {{else}}
                        <a href="/login">
                            <button type="button" class="btn btn-primary">Login</button>
                        </a>
                        {{end}}
                    </li>
                </ul>
            </div>
        </div>
    </div>
    {{template "nav" .}}
    {{template "body" .}}
    <!-- Placed at the end of the document so the pages load faster -->
    <script src="/js/dist/vendor.min.js"></script>
    <script src="/js/dist/app/darkphish.min.js"></script>
    {{if .ModifySystem}}<script src="/js/dist/app/notifications.min.js"></script>{{end}}
    {{template "scripts" .}}
</body>

</html>
{{ end }}
