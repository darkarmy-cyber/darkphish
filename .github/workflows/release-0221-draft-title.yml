name: Repair v0.22.1 draft title

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-0221-draft-title.yml

permissions:
  contents: write
  actions: read
  checks: read

concurrency:
  group: protected-main-mutation
  cancel-in-progress: false
  queue: max

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0

      - name: Repair exact v0.22.1 draft title only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_ID: "399548475"
          TAG: v0.22.1
          SOURCE: 7d33ed03306772e215ecd2e39227649d9f8ff1a5
          EXPECTED_NAME: Darkphish 0.22
          LEGACY_NAME: Darkphish 0.22.1
        shell: bash
        run: |
          set -euo pipefail

          git merge-base --is-ancestor "$SOURCE" "$GITHUB_SHA"

          before="$(gh api "repos/$REPO/releases/$RELEASE_ID")"
          test "$(jq -r '.id' <<<"$before")" = "$RELEASE_ID"
          test "$(jq -r '.tag_name' <<<"$before")" = "$TAG"
          test "$(jq -r '.target_commitish' <<<"$before")" = "$SOURCE"
          test "$(jq -r '.draft' <<<"$before")" = "true"
          test "$(jq -r '.prerelease' <<<"$before")" = "false"
          test "$(jq -r '.author.login' <<<"$before")" = "github-actions[bot]"
          test "$(jq -r '.author.id' <<<"$before")" = "41898282"

          current_name="$(jq -r '.name' <<<"$before")"
          if [ "$current_name" != "$EXPECTED_NAME" ] && [ "$current_name" != "$LEGACY_NAME" ]; then
            echo "Unexpected release name: $current_name" >&2
            exit 1
          fi

          expected_body="$(node --input-type=module - <<'NODE'
          import {readFileSync} from "node:fs"
          import {releaseBody} from "./scripts/release-notes.mjs"
          const changelog = readFileSync("CHANGELOG.md", "utf8")
          process.stdout.write(releaseBody(changelog, "0.22.1", "7d33ed03306772e215ecd2e39227649d9f8ff1a5"))
          NODE
          )"
          actual_body="$(jq -r '.body // ""' <<<"$before" | tr -d '\r')"
          test "$actual_body" = "$expected_body"

          assets_before="$(gh api "repos/$REPO/releases/$RELEASE_ID/assets?per_page=100" | jq -c 'sort_by(.id) | map({id,name,size,digest,state,uploader:.uploader.id})')"
          test "$(jq 'length' <<<"$assets_before")" -eq 8

          if [ "$current_name" != "$EXPECTED_NAME" ]; then
            gh api --method PATCH "repos/$REPO/releases/$RELEASE_ID" -f name="$EXPECTED_NAME" >/dev/null
          fi

          after="$(gh api "repos/$REPO/releases/$RELEASE_ID")"
          test "$(jq -r '.id' <<<"$after")" = "$RELEASE_ID"
          test "$(jq -r '.tag_name' <<<"$after")" = "$TAG"
          test "$(jq -r '.target_commitish' <<<"$after")" = "$SOURCE"
          test "$(jq -r '.name' <<<"$after")" = "$EXPECTED_NAME"
          test "$(jq -r '.draft' <<<"$after")" = "true"
          test "$(jq -r '.prerelease' <<<"$after")" = "false"
          test "$(jq -r '.body // ""' <<<"$after" | tr -d '\r')" = "$expected_body"

          assets_after="$(gh api "repos/$REPO/releases/$RELEASE_ID/assets?per_page=100" | jq -c 'sort_by(.id) | map({id,name,size,digest,state,uploader:.uploader.id})')"
          test "$assets_after" = "$assets_before"

          echo "Canonical draft title restored: $EXPECTED_NAME"
