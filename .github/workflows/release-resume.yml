name: Resume verified v0.7.1

on:
  workflow_run:
    workflows: [CI, CodeQL]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '11,26,41,56 * * * *'

permissions:
  contents: read

concurrency:
  group: protected-main-mutation
  cancel-in-progress: false

jobs:
  resume:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: read
      issues: read
      security-events: read
      attestations: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - name: Verify resumption invariants
        run: node --test scripts/release-resume.test.mjs scripts/release-repair-policy.test.mjs
      - name: Resume only the original fully verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_EXECUTION_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/release-resume.mjs
