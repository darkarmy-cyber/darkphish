- name: Change /etc/hostname
  hostname:
    name: "{{ hostname }}"

- name: Ensure ufw is installed on the machine
  package:
    name: ufw
    state: present

- name: Allow TCP 22 for SSH.
  ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow TCP 80 for Darkphish.
  ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Allow TCP 443 for Darkphish.
  ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Enable ufw.
  ufw:
    state: enabled
    policy: deny
  when: enable_ufw_firewall

- name: Update APT package cache.
  apt:
    update_cache: yes

- name: Upgrade APT to the latest packages.
  apt:
    upgrade: safe

- name: Ensure /etc/ssl/csr folder exists
  file:
    path: /etc/ssl/csr
    state: directory
    mode: "0755"

- name: Ensure /etc/ssl/private folder exists
  file:
    path: /etc/ssl/private
    state: directory
    mode: "0755"

- name: Ensure /etc/ssl/crt folder exists
  file:
    path: /etc/ssl/crt
    state: directory
    mode: "0755"

- name: Install specified packages.
  apt:
    pkg: "{{ install_packages }}"
    state: latest

- name: adding existing user '{{ darkphish_user }}' to group ssl-cert
  user:
    name: "{{ darkphish_user }}"
    groups: ssl-cert
    append: yes

- name: Ensure the cryptography Python package is installed
  pip:
    name: cryptography

- name: Generate an OpenSSL private key with the default values (4096 bits, RSA)
  openssl_privatekey:
    path: "{{ darkphish_ssl_cert_path }}"

- name: Generate an OpenSSL Certificate Signing Request
  openssl_csr:
    path: "{{ darkphish_csr_path }}"
    privatekey_path: "{{ darkphish_ssl_cert_path }}"
    common_name: "{{ darkphish_domain }}"

- name: Generate a Self Signed OpenSSL certificate
  openssl_certificate:
    path: "{{ darkphish_crt_path }}"
    privatekey_path: "{{ darkphish_ssl_cert_path }}"
    csr_path: "{{ darkphish_csr_path }}"
    provider: selfsigned

- name: Update postfix main.cf configuration file.
  template:
    src: main.cf.j2
    dest: /etc/postfix/main.cf
    backup: yes
    owner: root
    group: root
    mode: 0644

- name: Restart postfix.
  service:
    name: postfix
    state: restarted

- name: Ensure postfix is started and enabled at boot.
  service:
    name: postfix
    state: started
    enabled: yes

- name: get latest release info
  uri:
    url: "https://api.github.com/repos/darkarmy-cyber/darkphish/releases/latest"
    return_content: true
  register: latest_json_reponse

- name: Download latest Darkphish .zip file.
  get_url:
    validate_certs: True
    url: "https://github.com/darkarmy-cyber/darkphish/releases/download/{{ latest_json_reponse.json.tag_name }}/darkphish-{{ latest_json_reponse.json.tag_name }}-linux-64bit.zip"
    dest: "/home/{{ darkphish_user }}/darkphish.zip"
    mode: 0755
    owner: "{{ darkphish_user }}"
    group: "{{ darkphish_user }}"

- name: Ensure darkphish user has permission for CRT file.
  file:
    path: "{{ darkphish_crt_path }}"
    mode: 0755
    owner: "{{ darkphish_user }}"
    group: "{{ darkphish_user }}"

- name: Ensure darkphish user has permission for SSL certificate.
  file:
    path: "{{ darkphish_ssl_cert_path }}"
    mode: 0755
    owner: "{{ darkphish_user }}"
    group: "{{ darkphish_user }}"

- name: Create directory for darkphish.
  file:
    path: "/home/{{ darkphish_user }}/darkphish_deploy"
    state: directory
    mode: 0755
    owner: "{{ darkphish_user }}"
    group: "{{ darkphish_user }}"

- name: Unzip darkphish file.
  unarchive:
    src: "/home/{{ darkphish_user }}/darkphish.zip"
    dest: "/home/{{ darkphish_user }}/darkphish_deploy"
    remote_src: True # File is on target server and not locally.
    owner: "{{ darkphish_user }}"
    group: "{{ darkphish_user }}"

- name: Change ownership of Darkphish folder and files.
  file:
    path: /home/{{ darkphish_user }}/darkphish_deploy
    owner: "{{ darkphish_user }}"
    group: "{{ darkphish_user }}"
    recurse: True

- name: Ensure darkphish binary is executable
  file:
    path: /home/{{ darkphish_user }}/darkphish_deploy/darkphish
    mode: 744

- name: Ensure darkphish binary is allowed to bind to privileged ports using setcap
  capabilities:
    path: /home/{{ darkphish_user }}/darkphish_deploy/darkphish
    capability: cap_net_bind_service+eip
    state: present

- name: Copy config.json file.
  copy:
    src: files/config.json
    dest: "/home/{{ darkphish_user }}/darkphish_deploy/config.json"
    owner: "{{ darkphish_user }}"
    group: "{{ darkphish_user }}"
    mode: 0644

- name: Ensure darkphish service file is properly set
  template:
    src: darkphish.service.j2
    dest: /etc/systemd/system/darkphish.service
    mode: 644

- name: Ensure systemd to reread configs
  systemd:
    daemon_reload: yes

- name: Ensure darkphish is properly started
  service:
    name: darkphish.service
    state: started
    enabled: yes

- name: Ensure nginx is installed
  package:
    name: nginx
    state: present

- name: Ensure nginx service file is properly set
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: 644

- name: Ensure nginx service is restarted
  service:
    name: nginx
    state: reloaded
    enabled: yes

- name: Reboot the box in 1 minute.
  command: shutdown -r 1
  when: reboot_box
