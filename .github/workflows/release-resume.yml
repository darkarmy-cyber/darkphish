name: Resume verified v0.7.1

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type resume-original-071 to run the historical repair'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: protected-main-mutation
  cancel-in-progress: false
  queue: max

jobs:
  resume:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.confirmation == 'resume-original-071'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: read
      issues: read
      security-events: read
      attestations: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - name: Verify resumption invariants
        run: node --test scripts/release-resume.test.mjs scripts/release-repair-policy.test.mjs
      - name: Resume only the original fully verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_EXECUTION_SHA: ${{ github.sha }}
        run: node scripts/release-resume.mjs
