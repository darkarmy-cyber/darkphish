{{ define "base" }}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DarkPhish — Human Risk Management Platform">
    <link rel="icon" type="image/svg+xml" href="/images/darkphish-mark.svg">

    <title>DarkPhish - {{ .Title }}</title>

    <link href="/css/dist/darkphish.css?v={{.Version}}" rel="stylesheet">
</head>

<body class="auth-page auth-login">
    <header class="auth-header">
        <a class="navbar-brand darkphish-brand" href="/" aria-label="DarkPhish home"><img src="/images/darkphish-mark.svg" alt="" width="40" height="40"><span>Dark<span class="brand-light">Phish</span></span></a>
        <a href="https://docs.darkphish.sk/" target="_blank" rel="noopener noreferrer">Documentation <span aria-hidden="true">↗</span></a>
    </header>
    <main class="auth-container">
        <section class="auth-introduction" aria-labelledby="welcome-heading">
            <h1 id="welcome-heading">Phishing<br>simulations.<br><span>Built for<br>defenders.</span></h1>
        </section>
        <form class="form-signin" action="" method="POST">
            <h2 class="form-signin-heading">Welcome back.</h2>
            <p class="auth-subtitle">Sign in to your DarkPhish workspace.</p>
            {{template "flashes" .Flashes}}
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" type="text" name="username" class="form-control" placeholder="Your username" autocomplete="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-lg btn-primary btn-block" type="submit">Sign in</button>
            <p class="auth-help">Having trouble? Contact your administrator.</p>
        </form>
    </main>
    <!-- Placed at the end of the document so the pages load faster -->
    <script src="/js/dist/vendor.min.js"></script>
</body>

</html>
{{ end }}
