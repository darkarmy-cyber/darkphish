name: Prepare release changelog

on:
  workflow_run:
    workflows: [CI, CodeQL]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: release-preparation
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: read
      security-events: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - id: hold
        name: Enforce release normalization hold
        run: node scripts/release-resume.mjs guard-rebuild
      - name: Preflight and recover the generated release pull request
        if: steps.hold.outputs.active != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-prepare.mjs
