name: Conservative Dependabot auto-merge

on:
  schedule:
    - cron: "23 5 * * 1-5"

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

concurrency:
  group: protected-main-mutation
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
      - name: Revoke legacy queues, then merge only controlled ready Dependabot updates synchronously
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t numbers < <(gh pr list --state open --base main --author 'app/dependabot' --label dependencies --json number --jq '.[].number')

          # Migration cleanup for native queues created by the previous implementation.
          # Revoke every surviving queue before any release-boundary return, so
          # GitHub cannot merge it later outside protected-main-mutation.
          for number in "${numbers[@]}"; do
            [ -n "$number" ] || continue
            author="$(gh pr view "$number" --json author --jq '.author.login')"
            [ "$author" = "app/dependabot" ] || [ "$author" = "dependabot" ] || continue
            queued="$(gh pr view "$number" --json autoMergeRequest --jq '.autoMergeRequest != null')"
            if [ "$queued" = "true" ]; then
              gh pr merge "$number" --disable-auto
            fi
          done

          node scripts/require-green-main.mjs

          for number in "${numbers[@]}"; do
            [ -n "$number" ] || continue
            author="$(gh pr view "$number" --json author --jq '.author.login')"
            [ "$author" = "app/dependabot" ] || [ "$author" = "dependabot" ] || continue
            title="$(gh pr view "$number" --json title --jq '.title')"
            files="$(gh pr view "$number" --json files --jq '.files[].path')"
            if node scripts/dependabot-automerge.mjs "$title" "$files"; then
              pr_sha="$(gh pr view "$number" --json headRefOid --jq '.headRefOid')"
              # Never queue a merge that may execute after this workflow releases
              # the protected-main-mutation lock. Merge synchronously or leave the
              # PR untouched for a later scheduled reconciliation.
              gh pr merge "$number" --squash --match-head-commit "$pr_sha" || true
            fi
          done
