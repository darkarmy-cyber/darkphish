{{ define "base" }}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Darkphish - Phishing Toolkit">
    <meta name="author" content="Jordan Wright (http://github.com/jordan-wright)">
    <link rel="shortcut icon" href="/images/favicon.ico">

    <title>{{ .Title }} - Darkphish</title>

    <link href="/css/dist/darkphish.css" rel="stylesheet" type="text/css">
    <script>
        {{if .User}}
    var user = {
        username : {{ .User.Username }}
    }
    {{end}}
    </script>
</head>

<body>
    <div class="navbar navbar-inverse navbar-fixed-top" role="navigation">
        <div class="container-fluid">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle" data-toggle="collapse" data-target=".navbar-collapse">
                    <span class="sr-only">Toggle navigation</span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <img class="navbar-logo" src="/images/logo_inv_small.png" />
                <a class="navbar-brand" href="/">&nbsp;darkphish</a>
            </div>
            <div class="navbar-collapse collapse">
                <ul class="nav navbar-nav navbar-right">
                    {{if .ModifySystem}}
                    <li class="dropdown" id="adminNotifications">
                        <a href="#" class="dropdown-toggle" data-toggle="dropdown" aria-label="Admin notifications" aria-expanded="false"><i class="fa fa-bell" aria-hidden="true"></i> <span id="adminNotificationBadge" class="badge" hidden></span></a>
                        <ul class="dropdown-menu"><li><a id="adminReleaseNotification" href="/settings?tab=update">Check release information</a></li></ul>
                    </li>
                    {{end}}
                    <li>
                        {{if .User}}
                        <div class="btn-group" id="navbar-dropdown">
                            <a class="btn btn-primary" href="/settings"><i class="fa fa-user"></i> {{.User.Username}}</a>
                            <a class="btn btn-primary dropdown-toggle" href="/logout">
                                <i class="fa fa-sign-out"></i>
                            </a>
                        </div>
                        {{else}}
                        <a href="/login">
                            <button type="button" class="btn btn-primary">Login</button>
                        </a>
                        {{end}}
                    </li>
                </ul>
            </div>
        </div>
    </div>
    {{template "nav" .}}
    {{template "body" .}}
    <!-- Placed at the end of the document so the pages load faster -->
    <script src="/js/dist/vendor.min.js"></script>
    <script src="/js/dist/app/darkphish.min.js"></script>
    {{if .ModifySystem}}<script src="/js/dist/app/notifications.min.js"></script>{{end}}
    {{template "scripts" .}}
</body>

</html>
{{ end }}
