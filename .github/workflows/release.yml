name: Native release

on:
  workflow_run:
    workflows: [CI, CodeQL]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '10,25,40,55 * * * *'

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: protected-main-mutation
  cancel-in-progress: false

jobs:
  metadata:
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      issues: read
      security-events: read
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.version.outputs.ready }}
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      built_at: ${{ steps.version.outputs.built_at }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
      - run: node scripts/changelog.mjs validate
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-publish.mjs metadata

  verify:
    needs: metadata
    if: needs.metadata.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: go test ./...
      - run: go vet ./...
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm audit --audit-level=high
      - run: git diff --exit-code

  binaries:
    needs: [metadata, verify]
    if: needs.metadata.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: windows-2025
            goos: windows
            goarch: amd64
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
          - os: macos-15
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      - name: Build native binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ext=""
          if [ "$GOOS" = windows ]; then ext=".exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "dist/darkphish${ext}" .
          if [ "$GOOS" = windows ]; then
            7z a "dist/darkphish-v${VERSION}-${GOOS}-${GOARCH}.zip" "dist/darkphish${ext}"
          else
            tar -C dist -czf "dist/darkphish-v${VERSION}-${GOOS}-${GOARCH}.tar.gz" "darkphish${ext}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/darkphish-v${{ needs.metadata.outputs.version }}-*
          if-no-files-found: error

  sbom:
    needs: metadata
    if: needs.metadata.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: darkphish-v${{ needs.metadata.outputs.version }}.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: darkphish-v${{ needs.metadata.outputs.version }}.spdx.json
          if-no-files-found: error

  publish:
    needs: [metadata, verify, binaries, sbom]
    if: needs.metadata.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: read
      issues: read
      security-events: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: dist
      - name: Generate immutable checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum darkphish-* > SHA256SUMS
      - name: Publish verified native release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-publish.mjs publish
