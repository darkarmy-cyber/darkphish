name: Resume verified v0.7.1

on:
  workflow_run:
    workflows: [CI, CodeQL]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: protected-main-mutation
  cancel-in-progress: false

jobs:
  resume:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: read
      issues: read
      security-events: read
      attestations: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - name: Verify resumption invariants
        run: node --test scripts/release-resume.test.mjs scripts/release-repair-policy.test.mjs
      - name: Resume only the original fully verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_EXECUTION_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/release-resume.mjs
