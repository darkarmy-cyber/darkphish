name: Native release

on:
  workflow_run:
    workflows: [CI, CodeQL]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '10,25,40,55 * * * *'

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  metadata:
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      issues: read
      security-events: read
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.version.outputs.ready }}
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      built_at: ${{ steps.version.outputs.built_at }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
      - run: node scripts/changelog.mjs validate
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-publish.mjs metadata

  verify:
    needs: metadata
    if: needs.metadata.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: go test ./...
      - run: go vet ./...
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm audit --audit-level=high
      - run: git diff --exit-code

  binaries:
    needs: [metadata, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            binary: darkphish
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            binary: darkphish
          - runner: windows-2025
            goos: windows
            goarch: amd64
            binary: darkphish.exe
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            binary: darkphish
          - runner: macos-15
            goos: darwin
            goarch: arm64
            binary: darkphish
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      - name: Enable the runner's MinGW compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compilerDirectory = @('C:\mingw64\bin', 'C:\msys64\mingw64\bin') |
            Where-Object { Test-Path -LiteralPath (Join-Path $_ 'gcc.exe') } |
            Select-Object -First 1
          if (-not $compilerDirectory) { throw "Required MinGW compiler is unavailable" }
          $compilerDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build and package native binary
        shell: pwsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_BINARY: ${{ matrix.binary }}
          BUILT_AT: ${{ needs.metadata.outputs.built_at }}
          COMMIT_SHA: ${{ needs.metadata.outputs.sha }}
        run: |
          $name = "darkphish-$env:RELEASE_TAG-$env:GOOS-$env:GOARCH"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          $ldflags = "-s -w -X main.releaseVersion=$env:RELEASE_VERSION -X main.commitSHA=$env:COMMIT_SHA -X main.builtAt=$env:BUILT_AT"
          go build -trimpath -ldflags $ldflags -o "dist/$name/$env:RELEASE_BINARY" ./
          if ($LASTEXITCODE -ne 0) { throw "Native build failed" }
          $versionOutput = & "dist/$name/$env:RELEASE_BINARY" version
          $versionParts = $env:RELEASE_VERSION -split '\.'
          $displayVersion = $versionParts[0..1] -join '.'
          if ($versionOutput -notmatch "Darkphish $displayVersion" -or $versionOutput -match '-dev' -or $versionOutput -notmatch [regex]::Escape($env:COMMIT_SHA)) {
            throw "Built binary did not report release metadata: $versionOutput"
          }
          Copy-Item VERSION,LICENSE,NOTICE.md,README.md,CHANGELOG.md,config.json -Destination "dist/$name"
          Copy-Item db,templates -Recurse -Destination "dist/$name"
          New-Item -ItemType Directory -Force -Path "dist/$name/static/js","dist/$name/static/css" | Out-Null
          Copy-Item static/images,static/font,static/db,static/endpoint -Recurse -Destination "dist/$name/static"
          Copy-Item static/js/dist,static/js/src -Recurse -Destination "dist/$name/static/js"
          Copy-Item static/css/dist -Recurse -Destination "dist/$name/static/css"
          if ($env:GOOS -eq 'windows') {
            Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          } else {
            tar -czf "dist/$name.tar.gz" -C dist $name
          }
      - uses: actions/upload-artifact@v7
        with:
          name: darkphish-${{ needs.metadata.outputs.tag }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  audit-smoke:
    needs: [metadata, binaries]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: darkphish_binary_audit_test
          POSTGRES_USER: darkphish
          POSTGRES_PASSWORD: darkphish-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darkphish -d darkphish_binary_audit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: darkphish-${{ needs.metadata.outputs.tag }}-linux-amd64
          path: .cache/native-audit
      - name: Extract the exact release archive
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: tar -xzf ".cache/native-audit/darkphish-$RELEASE_TAG-linux-amd64.tar.gz" -C .cache/native-audit
      - uses: ./.github/actions/audit-binary-smoke
        with:
          binary: .cache/native-audit/darkphish-${{ needs.metadata.outputs.tag }}-linux-amd64/darkphish
          sha: ${{ needs.metadata.outputs.sha }}

  publish:
    needs: [metadata, binaries, audit-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: read
      issues: read
      id-token: write
      attestations: write
      security-events: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@v8
        with:
          pattern: darkphish-*
          path: dist
          merge-multiple: true
      - uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          path: .
          format: spdx-json
          output-file: dist/darkphish-${{ needs.metadata.outputs.tag }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.zip *.tar.gz *.spdx.json > SHA256SUMS
      - uses: actions/attest@v4
        if: vars.RELEASE_ATTESTATIONS_SUPPORTED == 'true'
        with:
          subject-path: dist/*
      - name: Publish verified assets without overwriting an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-publish.mjs publish
