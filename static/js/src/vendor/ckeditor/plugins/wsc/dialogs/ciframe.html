<html>
<head>
	<title></title>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<script type="text/javascript">

function gup( name )
{
	// Match names literally, not as regular expressions. Preserve raw encoded
	// values: XDTMaster owns decoding of the legacy bridge protocol.
	var fields = window.location.search.slice( 1 ).split( '&' ) ;
	for ( var i = 0; i < fields.length; i++ )
	{
		var separator = fields[ i ].indexOf( '=' ) ;
		if ( separator >= 0 && fields[ i ].slice( 0, separator ) === name )
			return fields[ i ].slice( separator + 1 ) ;
	}
	return '' ;
}

var interval;

function sendData2Master()
{
	var destination = window.parent.parent ;
	try
	{
		if ( destination.XDTMaster )
		{
			var t = destination.XDTMaster.read( [ gup( 'cmd' ), gup( 'data' ) ] ) ;
			window.clearInterval( interval ) ;
		}
	}
	catch (e) {}
}

function OnMessage (event) {
	        var message = event.data;
	        var destination = window.parent.parent;
	        destination.XDTMaster.read( [ 'end', message, 'fpm' ] ) ;
}

function listenPostMessage() {
    if (window.addEventListener) { // all browsers except IE before version 9
            window.addEventListener ("message", OnMessage, false);
    }else {
            if (window.attachEvent) { // IE before version 9
                        window.attachEvent("onmessage", OnMessage);
                }
        }
}

function onLoad()
{
	interval = window.setInterval( sendData2Master, 100 );
	listenPostMessage();
}

</script>
</head>
<body onload="onLoad()"><p></p></body>
</html>
