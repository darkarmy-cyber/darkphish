name: WordPress licensing
on:
  pull_request:
    paths: ['integrations/wordpress/**', '.github/workflows/wordpress-licensing.yml']
  push:
    branches: [main]
    paths: ['integrations/wordpress/**', '.github/workflows/wordpress-licensing.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    name: WordPress licensing integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - name: Install PHP test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-mysql php-mbstring
          php -r 'exit(extension_loaded("sodium") ? 0 : 1);'
      - name: Check syntax and independently verify signed leases
        run: |
          find integrations/wordpress -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check integrations/wordpress/darkphish-license/assets/registration.js
          php integrations/wordpress/tests/signer.php "$RUNNER_TEMP/lease.json"
          node integrations/wordpress/tests/verify-signature.mjs "$RUNNER_TEMP/lease.json"
      - name: Prepare disposable WordPress and MySQL
        env:
          MYSQL_PWD: root
        run: |
          sudo systemctl start mysql.service
          mysql -uroot -e 'CREATE DATABASE darkphish_wp_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          curl --fail --location --proto '=https' --tlsv1.2 https://downloads.wordpress.org/release/wordpress-7.1.zip -o "$RUNNER_TEMP/wordpress.zip"
          echo "d1ae02b5ae18428031ffc3943659fa87ab361d827f4aa804adf9276e4dc75df6  $RUNNER_TEMP/wordpress.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/wordpress.zip" -d "$RUNNER_TEMP"
          cp -R integrations/wordpress/darkphish-license "$RUNNER_TEMP/wordpress/wp-content/plugins/"
          php integrations/wordpress/darkphish-license/tools/create-key.php "$RUNNER_TEMP/test-license-key.json" test-ephemeral > "$RUNNER_TEMP/test-public-keyring.json"
      - name: Test real WordPress routes and database concurrency
        env:
          DARKPHISH_WP_TEST_ROOT: ${{ runner.temp }}/wordpress
          DARKPHISH_WP_TEST_KEY: ${{ runner.temp }}/test-license-key.json
          DARKPHISH_WP_TEST_DB: darkphish_wp_test
          DARKPHISH_WP_TEST_PASSWORD: root
        run: php integrations/wordpress/tests/integration.php
