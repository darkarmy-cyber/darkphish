name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Version and changelog policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
      - name: Validate fragments
        if: github.event_name != 'pull_request'
        run: node scripts/changelog.mjs validate
      - name: Require a runtime fragment on pull requests
        if: github.event_name == 'pull_request'
        run: node scripts/changelog.mjs validate --base origin/${{ github.base_ref }}

  go:
    name: Go build, test, and analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      - name: Verify formatting
        shell: bash
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Build
        run: go build -trimpath ./...
      - name: Unit tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.0-rc.1
          staticcheck ./...
      - name: Vulnerability analysis
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      - name: Reject whitespace errors
        run: git diff --check
      - name: Verify checks did not rewrite tracked files
        run: git diff --exit-code

  mysql-migrations:
    name: MySQL migrations up/down/up
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      - name: Start runner MySQL service
        run: |
          sudo systemctl start mysql.service
          mysql -uroot -proot -e 'CREATE DATABASE darkphish_migration_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
      - name: Exercise MySQL migrations
        env:
          DARKPHISH_TEST_MYSQL_DSN: "root:root@tcp(127.0.0.1:3306)/darkphish_migration_test?charset=utf8mb4&parseTime=true&multiStatements=true"
        run: go test ./migrationtest -run TestMySQLMigrationsUpDownUp -count=1
      - name: Exercise MySQL security model
        env:
          DARKPHISH_TEST_MYSQL_DSN: "root:root@tcp(127.0.0.1:3306)/darkphish_migration_test?charset=utf8mb4&parseTime=true&multiStatements=true"
        run: go test ./databasetest -run TestMySQLSecurityModel -count=1

  postgres-migrations:
    name: PostgreSQL migrations up/down/up
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: darkphish_migration_test
          POSTGRES_USER: darkphish
          POSTGRES_PASSWORD: darkphish-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darkphish -d darkphish_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      - name: Exercise PostgreSQL migrations
        env:
          DARKPHISH_TEST_POSTGRES_DSN: "postgres://darkphish:darkphish-test-only@127.0.0.1:5432/darkphish_migration_test?sslmode=disable"
        run: go test ./migrationtest -run TestPostgreSQLMigrationsUpDownUp -count=1
      - name: Exercise PostgreSQL security model
        env:
          DARKPHISH_TEST_POSTGRES_DSN: "postgres://darkphish:darkphish-test-only@127.0.0.1:5432/darkphish_migration_test?sslmode=disable"
        run: go test ./databasetest -run TestPostgreSQLSecurityModel -count=1

  frontend:
    name: Frontend reproducibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Verify generated assets are committed
        run: git diff --exit-code -- static/js/dist static/css/dist
      - run: pnpm audit --audit-level=high
      - name: Verify clean generated tree
        run: git diff --exit-code

  secret-scan:
    name: Repository secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"
