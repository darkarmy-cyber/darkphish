name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer tag to prepare (for example v0.1.0)
        required: true
        type: string
      publish:
        description: Publish artifacts, container, and GitHub release after verification
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: go test ./...
      - run: go vet ./...
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: git diff --exit-code -- static/js/dist static/css/dist

  binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            binary: darkphish
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            binary: darkphish
          - runner: windows-2025
            goos: windows
            goarch: amd64
            binary: darkphish.exe
          - runner: macos-15-large
            goos: darwin
            goarch: amd64
            binary: darkphish
          - runner: macos-15
            goos: darwin
            goarch: arm64
            binary: darkphish
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
          cache: true
      - name: Build and package
        shell: pwsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BINARY: ${{ matrix.binary }}
        run: |
          $name = "darkphish-$env:RELEASE_VERSION-$env:GOOS-$env:GOARCH"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          go build -trimpath -ldflags "-s -w" -o "dist/$name/$env:RELEASE_BINARY" ./
          Copy-Item VERSION,LICENSE,NOTICE.md,README.md -Destination "dist/$name"
          Copy-Item db,templates -Recurse -Destination "dist/$name"
          New-Item -ItemType Directory -Force -Path "dist/$name/static/js","dist/$name/static/css" | Out-Null
          Copy-Item static/images,static/font,static/db,static/endpoint -Recurse -Destination "dist/$name/static"
          Copy-Item static/js/dist,static/js/src -Recurse -Destination "dist/$name/static/js"
          Copy-Item static/css/dist -Recurse -Destination "dist/$name/static/css"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: darkphish-${{ inputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.zip
          if-no-files-found: error

  assemble:
    needs: binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: darkphish-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.zip > SHA256SUMS
      - uses: anchore/sbom-action@v0.20.6
        with:
          path: .
          format: spdx-json
          output-file: dist/darkphish-${{ inputs.version }}.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: darkphish-${{ inputs.version }}-release-candidate
          path: dist/*
      - uses: actions/attest-build-provenance@v3
        if: inputs.publish
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@v2
        if: inputs.publish
        with:
          tag_name: ${{ inputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*

  container:
    needs: verify
    if: inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.version }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v4
      - name: Keyless-sign container manifest
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.version }}
        run: cosign sign --yes "$IMAGE"
