name: Repair v0.7.1 release title

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type repair-071-title to run the historical repair'
        required: true
        type: string

permissions:
  contents: write
  actions: read
  checks: read
  security-events: read

concurrency:
  group: protected-main-mutation
  cancel-in-progress: false
  queue: max

jobs:
  repair:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.confirmation == 'repair-071-title'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - name: Verify exact green protected main
        env:
          GH_TOKEN: ${{ github.token }}
          RECONCILE_EXECUTION_SHA: ${{ github.sha }}
        run: node scripts/release-reconcile.mjs verify-execution
      - name: Repair exact v0.7.1 release title
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_ID: "388329244"
          TAG: v0.7.1
          SOURCE: 73bf5948ed19cd918638453d478ef3f1cbe83d89
          EXPECTED_NAME: Darkphish 0.7.1
          LEGACY_NAME: Darkphish 0.7
        shell: bash
        run: |
          set -euo pipefail

          before="$(gh api "repos/$REPO/releases/tags/$TAG")"
          test "$(jq -r '.id' <<<"$before")" = "$RELEASE_ID"
          test "$(jq -r '.tag_name' <<<"$before")" = "$TAG"
          test "$(jq -r '.target_commitish' <<<"$before")" = "$SOURCE"
          test "$(jq -r '.draft' <<<"$before")" = "false"
          test "$(jq -r '.prerelease' <<<"$before")" = "false"
          test "$(jq -r '.author.login' <<<"$before")" = "github-actions[bot]"
          test "$(jq -r '.author.id' <<<"$before")" = "41898282"

          current_name="$(jq -r '.name' <<<"$before")"
          if [ "$current_name" != "$EXPECTED_NAME" ] && [ "$current_name" != "$LEGACY_NAME" ]; then
            echo "Unexpected release name: $current_name" >&2
            exit 1
          fi

          body_before="$(jq -j '.body // ""' <<<"$before" | sha256sum | cut -d' ' -f1)"
          published_before="$(jq -r '.published_at' <<<"$before")"
          assets_before="$(gh api "repos/$REPO/releases/$RELEASE_ID/assets?per_page=100" | jq -c 'sort_by(.id) | map({id,name,size,digest,state,uploader:.uploader.id})')"

          if [ "$current_name" != "$EXPECTED_NAME" ]; then
            gh api --method PATCH "repos/$REPO/releases/$RELEASE_ID" -f name="$EXPECTED_NAME" >/dev/null
          fi

          after="$(gh api "repos/$REPO/releases/$RELEASE_ID")"
          test "$(jq -r '.id' <<<"$after")" = "$RELEASE_ID"
          test "$(jq -r '.tag_name' <<<"$after")" = "$TAG"
          test "$(jq -r '.target_commitish' <<<"$after")" = "$SOURCE"
          test "$(jq -r '.name' <<<"$after")" = "$EXPECTED_NAME"
          test "$(jq -r '.draft' <<<"$after")" = "false"
          test "$(jq -r '.prerelease' <<<"$after")" = "false"
          test "$(jq -r '.published_at' <<<"$after")" = "$published_before"
          test "$(jq -j '.body // ""' <<<"$after" | sha256sum | cut -d' ' -f1)" = "$body_before"

          assets_after="$(gh api "repos/$REPO/releases/$RELEASE_ID/assets?per_page=100" | jq -c 'sort_by(.id) | map({id,name,size,digest,state,uploader:.uploader.id})')"
          test "$assets_after" = "$assets_before"

          echo "Release title is canonical: $EXPECTED_NAME"
