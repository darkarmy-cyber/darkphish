name: Protected native auto-merge

on:
  pull_request:
    types: [labeled, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'codex-automerge') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-24.04
    steps:
      - name: Enable squash auto-merge after protected checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh api "repos/$GH_REPO/branches/main" --jq '.protected')" = true
          test "$(gh api "repos/$GH_REPO" --jq '.allow_auto_merge')" = true
          pr_sha="$(gh pr view "$PR_URL" --json headRefOid --jq '.headRefOid')"
          gh pr merge "$PR_URL" --auto --squash --match-head-commit "$pr_sha"
