name: Native release

on:
  push:
    branches: [main, master]
    paths: [VERSION, CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-release
  cancel-in-progress: false

jobs:
  metadata:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'release: Darkphish ')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      built_at: ${{ steps.version.outputs.built_at }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
      - run: node scripts/changelog.mjs validate
      - id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          grep -q "^## $version " CHANGELOG.md
          if git ls-remote --exit-code --tags origin "refs/tags/v$version"; then
            echo "tag already exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  verify:
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: go test ./...
      - run: go vet ./...
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm audit --audit-level=high
      - run: git diff --exit-code

  binaries:
    needs: [metadata, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            binary: darkphish
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            binary: darkphish
          - runner: windows-2025
            goos: windows
            goarch: amd64
            binary: darkphish.exe
          - runner: macos-15-large
            goos: darwin
            goarch: amd64
            binary: darkphish
          - runner: macos-15
            goos: darwin
            goarch: arm64
            binary: darkphish
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      - name: Enable the runner's MinGW compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compilerDirectory = @('C:\mingw64\bin', 'C:\msys64\mingw64\bin') |
            Where-Object { Test-Path -LiteralPath (Join-Path $_ 'gcc.exe') } |
            Select-Object -First 1
          if (-not $compilerDirectory) { throw "Required MinGW compiler is unavailable" }
          $compilerDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build and package native binary
        shell: pwsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_BINARY: ${{ matrix.binary }}
          BUILT_AT: ${{ needs.metadata.outputs.built_at }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $name = "darkphish-$env:RELEASE_TAG-$env:GOOS-$env:GOARCH"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          $ldflags = "-s -w -X main.releaseVersion=$env:RELEASE_VERSION -X main.commitSHA=$env:COMMIT_SHA -X main.builtAt=$env:BUILT_AT"
          go build -trimpath -ldflags $ldflags -o "dist/$name/$env:RELEASE_BINARY" ./
          $versionOutput = & "dist/$name/$env:RELEASE_BINARY" version
          $versionParts = $env:RELEASE_VERSION -split '\.'
          $displayVersion = $versionParts[0..1] -join '.'
          if ($versionOutput -notmatch "Darkphish $displayVersion" -or $versionOutput -match '-dev' -or $versionOutput -notmatch [regex]::Escape($env:COMMIT_SHA)) {
            throw "Built binary did not report release metadata: $versionOutput"
          }
          Copy-Item VERSION,LICENSE,NOTICE.md,README.md,CHANGELOG.md,config.json -Destination "dist/$name"
          Copy-Item db,templates -Recurse -Destination "dist/$name"
          New-Item -ItemType Directory -Force -Path "dist/$name/static/js","dist/$name/static/css" | Out-Null
          Copy-Item static/images,static/font,static/db,static/endpoint -Recurse -Destination "dist/$name/static"
          Copy-Item static/js/dist,static/js/src -Recurse -Destination "dist/$name/static/js"
          Copy-Item static/css/dist -Recurse -Destination "dist/$name/static/css"
          if ($env:GOOS -eq 'windows') {
            Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          } else {
            tar -czf "dist/$name.tar.gz" -C dist $name
          }
      - uses: actions/upload-artifact@v7
        with:
          name: darkphish-${{ needs.metadata.outputs.tag }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [metadata, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: darkphish-*
          path: dist
          merge-multiple: true
      - uses: anchore/sbom-action@v0.20.6
        with:
          path: .
          format: spdx-json
          output-file: dist/darkphish-${{ needs.metadata.outputs.tag }}.spdx.json
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.zip *.tar.gz *.spdx.json > SHA256SUMS
      - uses: actions/attest@v4
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
